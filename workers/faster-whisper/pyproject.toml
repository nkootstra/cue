[project]
name = "cue-faster-whisper"
version = "0.1.0"
description = "cue's faster-whisper transcription worker: JSON on stdout, logs on stderr"
requires-python = ">=3.10"

[project.scripts]
cue-faster-whisper = "cue_faster_whisper:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
