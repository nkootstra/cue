name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          # macos-13 (Intel) runners are frequently unavailable; macOS x64
          # cross-compiles cleanly from an arm64 runner with the same SDK.
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.target }}/release/cue"

      - name: Package
        shell: bash
        run: |
          dir="cue-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/cue" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "cue-${{ matrix.target }}.tar.gz" "$dir"
          shasum -a 256 "cue-${{ matrix.target }}.tar.gz" \
            > "cue-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.target }}
          path: |
            cue-${{ matrix.target }}.tar.gz
            cue-${{ matrix.target }}.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Combined checksums
        run: shasum -a 256 cue-*.tar.gz > sha256sums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            cue-*.tar.gz cue-*.tar.gz.sha256 sha256sums.txt

  homebrew-tap:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Render and push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap update"
            exit 0
          fi
          sha() { grep "cue-$1.tar.gz" sha256sums.txt | cut -d' ' -f1; }
          export SHA_MAC_ARM="$(sha aarch64-apple-darwin)"
          export SHA_MAC_X64="$(sha x86_64-apple-darwin)"
          export SHA_LINUX_X64="$(sha x86_64-unknown-linux-gnu)"
          export SHA_LINUX_ARM="$(sha aarch64-unknown-linux-gnu)"
          export VERSION="${VERSION#v}"
          python3 scripts/render_formula.py > Formula/cue.rb
          gh api \
            --method PUT \
            "repos/nkootstra/homebrew-tap/contents/Formula/cue.rb" \
            -f message="cue $VERSION" \
            -f content="$(base64 -w0 Formula/cue.rb)" \
            -f sha="$(gh api repos/nkootstra/homebrew-tap/contents/Formula/cue.rb --jq .sha 2>/dev/null || echo '')" \
            --silent
          echo "Tap updated to $VERSION"
